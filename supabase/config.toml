project_id = "event-beast"

[api]
enabled = true
port = 54361
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54362
shadow_port = 54360
major_version = 17

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54363

[local_smtp]
enabled = true
port = 54364

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/auth/callback", "http://localhost:3100/auth/confirm"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = true

# Dedicated Cuantico Event Beast project. Local settings above stay local.
[remotes.production]
project_id = "nyhzmazbfctuttizwnxp"

[remotes.production.auth]
site_url = "https://eventapp.momentumbuilder.com"
additional_redirect_urls = ["https://eventapp.momentumbuilder.com/auth/callback", "https://eventapp.momentumbuilder.com/auth/callback?next=/more/profile", "https://eventapp.momentumbuilder.com/auth/callback?next=/reset-password", "https://eventapp.momentumbuilder.com/auth/confirm", "https://event-beast.vercel.app/auth/callback", "https://event-beast.vercel.app/auth/callback?next=/more/profile", "https://event-beast.vercel.app/auth/callback?next=/reset-password", "https://event-beast.vercel.app/auth/confirm", "http://127.0.0.1:3101/auth/callback", "http://127.0.0.1:3101/auth/callback?next=/more/profile", "http://127.0.0.1:3101/auth/callback?next=/reset-password", "http://127.0.0.1:3101/auth/confirm"]
minimum_password_length = 12
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[remotes.production.auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[remotes.production.auth.email.smtp]
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASSWORD)"
admin_email = "accounts@noreply.momentumbuilder.com"
sender_name = "Momentum Builder LIVE 2026"

[remotes.production.auth.email.template.confirmation]
subject = "Verify your Momentum Builder event account"
content_path = "./supabase/templates/confirmation.html"

[remotes.production.auth.email.template.recovery]
subject = "Reset your Momentum Builder event password"
content_path = "./supabase/templates/recovery.html"

[remotes.production.auth.email.template.invite]
subject = "Activate your Momentum Builder event account"
content_path = "./supabase/templates/invite.html"

# Keep per-email frequency controls; allow a shared venue IP to serve the room.
# These are request rates, not a promise that 500 emails arrive instantly.
[remotes.production.auth.rate_limit]
sign_in_sign_ups = 6000
token_refresh = 6000
token_verifications = 6000

[remotes.production.auth.sessions]
timebox = "0s"
inactivity_timeout = "0s"

[remotes.production.auth.sms]
enable_signup = false

[remotes.production.storage]
file_size_limit = "8MiB"
