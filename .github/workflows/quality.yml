name: Event Beast quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-beast-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENT_BEAST_DEMO_MODE: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_EVENT_SLUG: momentum-builder-live-2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare isolated dependency review
        if: github.head_ref == 'feat/agency-subaccounts'
        run: tar -czf dependency-review.tar.gz node_modules
      - name: Save isolated dependency review
        if: github.head_ref == 'feat/agency-subaccounts'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-review
          path: dependency-review.tar.gz
          retention-days: 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:legacy -- --output test-results/legacy
      - run: npm run test:mobile:webkit
      - name: Save browser qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qualification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
