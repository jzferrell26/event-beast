name: Event Beast platform integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-beast-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform-integration:
    if: github.head_ref == 'feat/agency-subaccounts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npx --yes supabase@2.121.0 start --help
      - run: npx --yes supabase@2.121.0 status --help
      - run: npx --yes supabase@2.121.0 db reset --help
      - run: npx --yes supabase@2.121.0 db advisors --help
      - run: npx --yes supabase@2.121.0 stop --help
