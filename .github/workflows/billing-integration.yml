name: Event Beast billing integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: event-beast-billing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-reviewed-source:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/subscription-provisioning'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Restore the reviewed implementation patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          encoded = ''.join(pathlib.Path(f'.github/billing-stage-{i}.b64').read_text().strip() for i in range(1, 7))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=128 * 1024 * 1024)
          assert len(patch) == 198504, 'Unexpected implementation size'
          assert hashlib.sha256(patch).hexdigest() == '7882118f0d60c8c262f6d3e34580771875d1d403a3dd8afb4ea80af7ea08d04a', 'Implementation checksum mismatch'
          pathlib.Path('/tmp/event-beast-subscription-implementation.patch').write_bytes(patch)
          print('Verified the exact reviewed implementation patch.')
          PY
          git apply --check /tmp/event-beast-subscription-implementation.patch
          git apply --index /tmp/event-beast-subscription-implementation.patch
          git diff --cached --stat
          git diff --cached --check
      - run: npm ci
      - run: npm run check
        env:
          EVENT_BEAST_DEMO_MODE: 'true'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      - name: Commit the validated implementation to its feature branch
        run: |
          git rm -- .github/billing-stage-1.b64 .github/billing-stage-2.b64 .github/billing-stage-3.b64 .github/billing-stage-4.b64 .github/billing-stage-5.b64 .github/billing-stage-6.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add subscription checkout and automatic customer subaccounts'
          git push origin HEAD:refs/heads/feat/subscription-provisioning
          git rev-parse HEAD
